plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

android {
    namespace = "com.example.picsorter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.picsorter"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}
    dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.9.0') // Firebase BOM for version management
    implementation 'com.google.firebase:firebase-auth' // Firebase Authentication (for login)
    implementation 'com.google.firebase:firebase-firestore' // Firebase Firestore (if you're using Firestore)
    implementation 'com.google.android.gms:play-services-auth:20.0.0' // Google Play services (for Google Sign-In)
    implementation 'com.google.firebase:firebase-analytics' // Firebase Analytics (if you're using analytics)
}
apply plugin: 'com.google.gms.google-services'

flutter {
    source = "../.."
}
